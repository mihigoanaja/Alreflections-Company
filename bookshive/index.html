<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookshive - Free Book Discovery</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #020617;
      color: #e5e7eb;
      margin: 0;
      padding: 20px;
    }
    h1 { font-size: 1.8rem; margin-bottom: 6px; }
    .subtitle { color: #94a3b8; margin-bottom: 20px; }
    .search-bar { display: flex; gap: 10px; max-width: 600px; margin-bottom: 24px; }
    input { flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid #1e293b; background: #020617; color: #e5e7eb; font-size: 1rem; }
    button { padding: 12px 18px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; background: linear-gradient(135deg, #38bdf8, #0ea5e9); color: #020617; }
    button:hover { opacity: 0.9; }
    .books { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .book { background: #020617; border: 1px solid #1e293b; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; box-shadow: 0 10px 20px rgba(0,0,0,0.25); }
    .book img { width: 100%; border-radius: 8px; margin-bottom: 10px; background: #020617; }
    .book h3 { font-size: 1rem; margin: 0 0 6px 0; }
    .author { font-size: 0.85rem; color: #94a3b8; margin-bottom: 10px; }
    .actions a { text-decoration: none; display: block; margin-top: 6px; padding: 8px; border-radius: 8px; font-size: 0.85rem; text-align: center; font-weight: 600; }
    .openlib { background: #22c55e; color: #020617; }
    .gutenberg { background: #facc15; color: #020617; }
    .status { color: #38bdf8; font-style: italic; margin-bottom: 12px; }
    footer { margin-top: 30px; font-size: 0.85rem; color: #64748b; }
  </style>
</head>
<body>

  <h1>Bookshive - Free Book Discovery</h1>
  <p class="subtitle">Powered By Alreflections</p>

  <div class="search-bar">
    <input id="query" type="text" placeholder="Search by title, author, or topic…" />
    <button onclick="searchBooks()">Search</button>
  </div>

  <div id="status" class="status"></div>
  <div id="books" class="books"></div>

  <footer>
    Built By Alreflections Friends
  </footer>

  <script>
    const booksEl = document.getElementById("books");
    const statusEl = document.getElementById("status");

    async function renderBooks(data) {
      booksEl.innerHTML = "";
      if (!data.docs || !data.docs.length) {
        statusEl.textContent = "No books found.";
        return;
      }
      statusEl.textContent = "";
      data.docs.forEach(book => {
        const cover = book.cover_i ? `https://covers.openlibrary.org/b/id/${book.cover_i}-M.jpg` : "https://via.placeholder.com/200x300?text=No+Cover";
        const openLibLink = `https://openlibrary.org${book.key}`;
        const gutenbergLink = book.ebook_access === "public" && book.ia ? `https://www.gutenberg.org/ebooks/${book.ia[0]}` : null;
        const el = document.createElement("div");
        el.className = "book";
        el.innerHTML = `
          <img src="${cover}" alt="Book cover" />
          <h3>${book.title}</h3>
          <div class="author">${(book.author_name || []).slice(0,2).join(", ")}</div>
          <div class="actions">
            <a class="openlib" href="${openLibLink}" target="_blank">View on Open Library</a>
            ${gutenbergLink ? `<!--<a class="gutenberg" href="${gutenbergLink}" target="_blank">Read on Gutenberg</a>-->` : ""}
          </div>
        `;
        booksEl.appendChild(el);
      });
    }

    async function searchBooks() {
      const q = document.getElementById("query").value.trim();
      if (!q) return;
      statusEl.textContent = "Searching free books…";
      try {
        const res = await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=20`);
        const data = await res.json();
        renderBooks(data);
      } catch (e) {
        statusEl.textContent = "Failed to fetch books. Try again later.";
        console.error(e);
      }
    }

    async function loadDefaultBooks() {
      statusEl.textContent = "Loading popular books…";
      try {
        // Use a broader popular term to ensure results
        const res = await fetch(`https://openlibrary.org/search.json?q=money&limit=20`);
        const data = await res.json();
        renderBooks(data);
      } catch (e) {
        statusEl.textContent = "Failed to load books.";
        console.error(e);
      }
    }

    // Load default books once DOM is ready
    document.addEventListener("DOMContentLoaded", loadDefaultBooks);
  </script>
</body>

</html>
