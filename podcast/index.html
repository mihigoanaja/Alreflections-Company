<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Alreflections Podcast</title>
		<style>
			:root {
				--bg: #0e141b;
				--accent: #c9b037;
				--card: #16222e;
				--text: #e7edf4;
				--muted: #96a0aa;
				--radius: 14px;
				font-family: "Inter", system-ui, sans-serif;
			}
			html, body {
				height: 100%;
				margin: 0;
				background: linear-gradient(180deg, var(--bg), #070d14);
				color: var(--text);
			}
			.wrapper {
				max-width: 1000px;
				margin: auto;
				padding: 30px 20px;
			}
			header {
				display: flex;
				align-items: center;
				gap: 16px;
				margin-bottom: 30px;
			}
			.logo {
				width: 64px;
				height: 64px;
				border-radius: var(--radius);
				background: linear-gradient(135deg, var(--accent), #9a7b22);
				display: flex;
				align-items: center;
				justify-content: center;
				font-size: 30px;
				font-weight: 800;
				color: #111;
				box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
			}
			h1 {
				margin: 0;
				font-size: 28px;
			}
			p.lead {
				margin: 4px 0 0;
				color: var(--muted);
			}
			.show {
				display: flex;
				flex-wrap: wrap;
				gap: 24px;
				margin-bottom: 40px;
			}
			.show img {
				width: 240px;
				border-radius: var(--radius);
				object-fit: cover;
				box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
			}
			.show-details {
				flex: 1;
				min-width: 260px;
			}
			.show-details h2 {
				margin: 0 0 8px;
			}
			.show-details p {
				color: var(--muted);
				font-size: 15px;
				line-height: 1.5;
			}
			.episodes {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
				gap: 16px;
				padding-bottom: 100px;
			}
			.episode {
				background: var(--card);
				border-radius: var(--radius);
				padding: 16px;
				cursor: pointer;
				display: flex;
				flex-direction: column;
				transition: transform 0.2s ease;
			}
			.episode:hover {
				transform: translateY(-3px);
			}
			.episode img {
				width: 100%;
				height: 180px;
				border-radius: var(--radius);
				object-fit: cover;
				margin-bottom: 12px;
			}
			.episode h3 {
				margin: 0;
				font-size: 16px;
			}
			.episode p {
				color: var(--muted);
				font-size: 13px;
				margin: 6px 0 0;
			}
			.player {
				position: fixed;
				bottom: 0;
				left: 0;
				right: 0;
				background: var(--card);
				border-top: 1px solid rgba(255, 255, 255, 0.05);
				padding: 12px 18px;
				display: flex;
				align-items: center;
				gap: 16px;
				padding-bottom: 50px;
			}
			.player img {
				width: 56px;
				height: 56px;
				border-radius: 8px;
				object-fit: cover;
			}
			.player-info {
				flex: 1;
				min-width: 0;
			}
			.player-info h4 {
				margin: 0;
				font-size: 15px;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}
			.player-info p {
				margin: 3px 0 0;
				font-size: 12px;
				color: var(--muted);
			}
			.play-btn {
				width: 42px;
				height: 42px;
				border-radius: 50%;
				background: var(--accent);
				color: #111;
				border: none;
				cursor: pointer;
				font-size: 18px;
				font-weight: 700;
			}
			.progress {
				flex: 1;
				height: 6px;
				background: rgba(255, 255, 255, 0.1);
				border-radius: 6px;
				overflow: hidden;
				cursor: pointer;
			}
			.progress i {
				display: block;
				height: 100%;
				background: var(--accent);
				width: 0%;
			}
			@media (max-width: 640px) {
				header {
					flex-direction: column;
					align-items: flex-start;
				}
				.show {
					flex-direction: column;
				}
				.player {
					flex-wrap: wrap;
				}
			}
			/* Hide podcast name */
			.show {
				display: none;
			}
		</style>
	</head>
	<body>
		<div class="wrapper">
			<header>
				<div class="logo">P</div>
				<div>
					<h1>Alreflections Podcast</h1>
					<p class="lead">Where every voice finds its moment.</p>
				</div>
			</header>
			<section class="show">
				<img id="showArt" src="" alt="Podcast Cover" />
				<div class="show-details">
					<h2 id="showTitle">Loading...</h2>
					<p id="showDesc">Fetching show details...</p>
				</div>
			</section>
			<section id="episodes" class="episodes"></section>
		</div>
		<div class="player" id="player" style="display:none">
			<button class="play-btn" id="playBtn">▶</button>
			<img id="playerThumb" src="" alt="">
			<div class="player-info">
				<h4 id="playerTitle"></h4>
				<p id="playerDate"></p>
			</div>
			<div class="progress" id="progress"><i></i></div>
			<audio id="audio" preload="none"></audio>
		</div>
		<script src="https://monella.alreflections.net/main.js"></script>

	</body>

</html>
